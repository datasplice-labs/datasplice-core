name: "x"
version: "0.1.0"
manifest_version: 1
base_url: "https://api.example.com"
secrets:
  TOKEN:
    description: "token"
actions:
  create:
    role: sink
    method: POST
    path: "/items"
    body:
      auth:
        # This is invalid because secrets cannot be used in the body of an action.
        # They are only allowed in headers of an action.
        - "{{ secrets.TOKEN }}"
