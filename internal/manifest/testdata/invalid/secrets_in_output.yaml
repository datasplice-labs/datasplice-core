name: "x"
version: "0.1.0"
manifest_version: 1
base_url: "https://api.example.com"
secrets:
  TOKEN:
    description: "token"
actions:
  context:
    role: transform
    method: POST
    path: "/context"
    output:
      # This is invalid because outputs cannot reference secrets.
      derived: "$.{{ secrets.TOKEN }}"
