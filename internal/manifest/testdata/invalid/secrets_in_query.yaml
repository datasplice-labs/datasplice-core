name: "x"
version: "0.1.0"
manifest_version: 1
base_url: "https://api.example.com"
secrets:
  TOKEN:
    description: "token"
actions:
  list:
    role: source
    method: GET
    path: "/items"
    query:
      # This is invalid because query parameters cannot reference secrets.
      api_key: "{{ secrets.TOKEN }}"
